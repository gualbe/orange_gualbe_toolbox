[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orange_gualbe_toolbox"
version = "0.5.3"
description = "Utilidades visuales de ciencia de datos para Orange Data Mining."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Gualberto Asencio Cortés", email = "gualbe@gmail.com"},
]
keywords = ["orange3 add-on"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "Orange3>=3.32.0",
    "imbalanced-learn",
    "pandas>=2.0",
    "openpyxl",
    "xlrd",
    "baycomp",
    "scipy>=1.9",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/gualbe/orange_gualbe_toolbox"
Repository = "https://github.com/gualbe/orange_gualbe_toolbox"
Issues = "https://github.com/gualbe/orange_gualbe_toolbox/issues"

[project.entry-points."orange3.addon"]
orange_gualbe_toolbox = "orangecontrib.orange_gualbe_toolbox"

[project.entry-points."orange.widgets"]
"Toolbox Gualbe" = "orangecontrib.orange_gualbe_toolbox.widgets"

[project.entry-points."orange.canvas.help"]
intersphinx = "orangecontrib.orange_gualbe_toolbox.widgets:WIDGET_HELP_PATH"

[tool.setuptools.packages.find]
include = ["orangecontrib*"]
namespaces = true

[tool.setuptools.package-data]
"orangecontrib.orange_gualbe_toolbox.widgets" = ["icons/*.svg"]
"orangecontrib.orange_gualbe_toolbox" = ["_help/html/**/*"]
